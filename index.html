<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101218">
  <title>RiaCast</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img src="assets/logo.svg" alt="Logo RiaCast" class="brand-logo">
        <div class="brand-text">
          <h1 class="brand-title">RiaCast</h1>
          <p class="brand-subtitle">Live broadcast P2P</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Pengaturan" title="Pengaturan">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94 7.43 7.43 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
        </button>
        <button id="btn-admin" class="icon-btn" type="button" aria-label="Admin" title="Admin">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 12c4.42 0 8 2.01 8 4.5V21H4v-2.5C4 16.01 7.58 14 12 14Zm7-8h3v2h-3v3h-2V8h-3V6h3V3h2v3Z"/></svg>
        </button>
      </div>
    </header>

    <main class="main-grid">
      <section class="stage-card" aria-label="Panggung siaran">

        <div class="video-stage" id="video-stage">
          <video id="main-video" class="main-video" autoplay playsinline></video>
          <div class="video-overlay" id="video-overlay">
            <div class="overlay-inner">
              <img src="assets/logo.svg" alt="" class="overlay-logo">
              <p id="overlay-title">RiaCast</p>
              <p id="overlay-sub" class="overlay-sub">Menyiapkan koneksi PeerJS...</p>
            </div>
          </div>
          <div class="local-pip" id="local-pip">
            <video id="local-video" autoplay muted playsinline></video>
            <span class="pip-label" id="local-label">Kamu</span>
          </div>
          <div id="viewer-panel" class="viewer-panel hidden" aria-label="Penonton">
            <div class="viewer-strip-wrap">
              <button id="viewer-scroll-left" class="viewer-scroll" type="button" aria-label="Geser kiri">&#8249;</button>
              <div id="viewer-strip" class="viewer-strip"></div>
              <button id="viewer-scroll-right" class="viewer-scroll" type="button" aria-label="Geser kanan">&#8250;</button>
            </div>
          </div>
          <button id="btn-fullscreen" class="fs-btn" type="button" aria-label="Layar penuh" title="Layar penuh">
            <svg id="fs-icon-expand" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg id="fs-icon-compress" class="hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>

      </section>

      <aside class="side-card">
        <div class="side-section">
          <h3 class="side-title">Status</h3>
          <div class="info-row"><span class="info-k">Mode</span><span class="info-v" id="info-mode">Penonton</span></div>
          <div class="info-row"><span class="info-k">ID Saya</span><span class="info-v" id="my-id">-</span></div>
          <div class="info-row"><span class="info-k">Target</span><span class="info-v" id="target-id">riacast-99</span></div>
          <div class="info-row"><span class="info-k">Koneksi</span><span class="info-v" id="conn-count">0</span></div>
          <div class="info-row"><span class="info-k">PeerJS</span><span class="info-v" id="info-peer">-</span></div>
          <div class="info-row"><span class="info-k">Admin</span><span class="info-v" id="info-admin">Memeriksa...</span></div>
          <div class="info-row"><span class="info-k">Media</span><span class="info-v" id="info-media">Belum siap</span></div>
        </div>
        <div class="side-section log-section">
          <h3 class="side-title">Log</h3>
          <div id="log-list" class="log-list" aria-live="polite"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="overlay-card">
      <div class="overlay-head">
        <h2 id="settings-title">Pengaturan</h2>
        <button type="button" class="overlay-close" data-close="settings-overlay" aria-label="Tutup">&times;</button>
      </div>
      <div class="overlay-body">
        <label class="field">
          <span>Nama tampilan</span>
          <input id="display-name" type="text" maxlength="32" placeholder="Nama Anda">
        </label>
        <label class="field toggle-row">
          <span>Mulai dengan kamera</span>
          <input id="pref-camera" type="checkbox" checked>
        </label>
        <label class="field toggle-row">
          <span>Mulai dengan mikrofon</span>
          <input id="pref-mic" type="checkbox" checked>
        </label>
        <p class="field-note">Pengaturan disimpan di perangkat ini.</p>
        <div class="overlay-actions">
          <button id="save-settings" type="button" class="btn-primary">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <div id="admin-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="overlay-card">
      <div class="overlay-head">
        <h2 id="admin-title">Masuk Admin</h2>
        <button type="button" class="overlay-close" data-close="admin-overlay" aria-label="Tutup">&times;</button>
      </div>
      <div class="overlay-body">
        <p class="field-note">Masukkan password untuk masuk sebagai penyiar.</p>
        <label class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input id="admin-password" type="password" autocomplete="off" placeholder="Password admin">
            <button id="toggle-admin-password" type="button" class="pw-toggle" aria-label="Tampilkan password">👁</button>
          </div>
        </label>
        <p id="admin-error" class="form-error" aria-live="polite"></p>
        <div class="overlay-actions">
          <button id="admin-login" type="button" class="btn-primary">Masuk</button>
        </div>
      </div>
    </div>
  </div>

  <script src="peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
